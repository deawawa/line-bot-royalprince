name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders only — real secrets live in Vercel env vars
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          ADMIN_SECRET: ci-placeholder-secret-0000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Security check (audit high+)
        run: npm audit --audit-level=high || true
